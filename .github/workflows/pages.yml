# SPDX-License-Identifier: GPL-3.0-only
# Publish the web installer on GitHub Pages.
#   push to main that changes web/   -> the site from main, with the package of the latest release
#   workflow_dispatch (version, ref) -> download locus-VERSION.fwsc from the release vVERSION (blank: the latest),
#                                       check them against its SHA256SUMS, web/make_site.py --release, deploy to Pages
# release.yml starts it after it made the release. With no release yet there is nothing to publish and it stops.
# Settings -> Pages -> Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.1 (blank: the latest release)"
        required: false
        default: ""
        type: string
      ref:
        description: "Branch, tag or commit the site is built from (blank: the default branch)"
        required: false
        default: ""
        type: string

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.11"

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - name: Pick the version (the input, else the latest release)
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
            if [ -z "$tag" ]; then
              echo "::notice::No release yet, so no site to publish: push a tag vX.Y and release.yml publishes it"
              exit 0
            fi
            VERSION="${tag#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]\.[0-9](-[A-Za-z0-9]+)?$ ]]; then
            echo "::error::version '$VERSION' is not X.Y or X.Y-suffix (e.g. 0.1, without the v)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  site:
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download the package from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rel="build/release-$VERSION"
          mkdir -p "$rel"
          for f in "locus-$VERSION.fwsc" SHA256SUMS; do
            if ! gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$f" --dir "$rel" --clobber; then
              echo "::error title=No $f in v$VERSION::The release v$VERSION does not exist or has no asset $f. Push the tag v$VERSION so release.yml builds it, then run pages.yml again."
              exit 1
            fi
          done
          (cd "$rel" && sha256sum -c SHA256SUMS)

      - name: Make the site (web/make_site.py)
        run: |
          set -euo pipefail
          python3 web/make_site.py --release "build/release-$VERSION"
          for f in index.html installer.js fm1ota.js fm1pkg.js firmware/manifest.json firmware/SHA256SUMS \
                   firmware/LICENSE firmware/LICENSING.md "firmware/locus-$VERSION.fwsc"; do
            if [ ! -s "build/site/$f" ]; then
              echo "::error::build/site/$f is missing"
              exit 1
            fi
          done
          (cd build/site/firmware && sha256sum -c SHA256SUMS)
          find build/site -type f | sort

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
